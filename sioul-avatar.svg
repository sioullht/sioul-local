<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a45e6"/>
      <stop offset="1" stop-color="#2b1b78"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>

  <!-- Klammern -->
  <path d="M22 19 Q11 33 22 48" fill="none" stroke="#c9b8ff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M42 19 Q53 33 42 48" fill="none" stroke="#c9b8ff" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Arme: links locker nach unten, rechts winkend nach oben -->
  <path d="M32 33 Q27.5 34.5 25.5 38.5" fill="none" stroke="#f3f0ff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M32 33 Q36.5 31 38 26.5" fill="none" stroke="#f3f0ff" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Körper (i-Strich) und Kopf (Punkt) -->
  <line x1="32" y1="30" x2="32" y2="45" stroke="#f3f0ff" stroke-width="5" stroke-linecap="round"/>
  <circle cx="32" cy="22.5" r="3.6" fill="#5ad1c8"/>

  <!-- Sprechblase oben rechts -->
  <path d="M46 4.5 h11 a3.5 3.5 0 0 1 3.5 3.5 v5 a3.5 3.5 0 0 1 -3.5 3.5 h-6.5 l-4 3.5 v-3.5 h-0.5
           a3.5 3.5 0 0 1 -3.5 -3.5 v-5 a3.5 3.5 0 0 1 3.5 -3.5 z" fill="#5ad1c8"/>
  <circle cx="47.5" cy="10.5" r="1.2" fill="#2b1b78"/>
  <circle cx="51.5" cy="10.5" r="1.2" fill="#2b1b78"/>
  <circle cx="55.5" cy="10.5" r="1.2" fill="#2b1b78"/>
</svg>
